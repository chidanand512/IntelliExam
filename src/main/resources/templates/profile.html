<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile | IntelliExam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments :: head-assets}"></th:block>
</head>
<body>
<div class="app-shell-app">
    <aside th:replace="~{fragments :: sidenav(${user.role.name()}, 'profile')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments :: topbar('Profile','Manage your account information.')}"></header>

        <main class="app-content animate-fade-up">
            <div class="row g-4">
                <div class="col-lg-5">
                    <section class="content-panel text-center animate-pop">
                        <div class="avatar mx-auto" style="width:96px; height:96px; font-size:2.5rem;"
                             th:text="${user.fullName != null and #strings.length(user.fullName) > 0 ? user.fullName.substring(0,1).toUpperCase() : 'U'}">U</div>
                        <h2 class="h4 fw-bold mt-3 mb-1" th:text="${user.fullName}">User</h2>
                        <p class="muted-copy mb-2" th:text="${user.email}">email</p>
                        <span class="badge-soft info" th:text="${user.role}">ROLE</span>
                        <hr>
                        <div class="text-start">
                            <p class="mb-2"><i class="bi bi-telephone"></i> <span th:text="${user.phone ?: 'Add phone'}">Phone</span></p>
                            <p class="mb-2"><i class="bi bi-building"></i> <span th:text="${user.college ?: 'Add college'}">College</span></p>
                            <div th:if="${user.role.name() == 'STUDENT'}">
                                <p class="mb-2"><i class="bi bi-diagram-3"></i> <span th:text="${user.branch ?: 'Add branch'}">Branch</span></p>
                                <p class="mb-2"><i class="bi bi-calendar2-week"></i> <span th:text="${user.academicYear ?: 'Add year'}">Year</span></p>
                                <p class="mb-0"><i class="bi bi-person-vcard"></i> <span th:text="${user.registerNumber ?: 'Add register number'}">Register</span></p>
                            </div>
                        </div>
                    </section>
                </div>
                <div class="col-lg-7">
                    <section class="content-panel animate-fade-up">
                        <span class="badge-soft"><i class="bi bi-pencil-square"></i> Edit details</span>
                        <h2 class="h4 fw-bold mt-3">Update profile</h2>
                        <p class="muted-copy">Accurate info helps your examiner identify you on reports.</p>
                        <form method="post" th:action="@{/profile/update}" class="mt-3">
                            <input type="hidden" name="userId" th:value="${user.id}">
                            <div class="mb-3">
                                <label class="form-label" for="fullName"><i class="bi bi-person"></i> Full name</label>
                                <input id="fullName" class="form-control" name="fullName" th:value="${user.fullName}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="phone"><i class="bi bi-telephone"></i> Phone</label>
                                <input id="phone" class="form-control" name="phone" th:value="${user.phone}">
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="college"><i class="bi bi-building"></i> College / Organization</label>
                                <input id="college" class="form-control" name="college" th:value="${user.college}">
                            </div>
                            <div class="row g-3 mb-4" th:if="${user.role.name() == 'STUDENT'}">
                                <div class="col-md-4">
                                    <label class="form-label" for="branch"><i class="bi bi-diagram-3"></i> Branch</label>
                                    <input id="branch" class="form-control" name="branch" th:value="${user.branch}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="academicYear"><i class="bi bi-calendar2-week"></i> Year</label>
                                    <select id="academicYear" class="form-select" name="academicYear">
                                        <option value="">Select year</option>
                                        <option value="1st Year" th:selected="${user.academicYear == '1st Year'}">1st Year</option>
                                        <option value="2nd Year" th:selected="${user.academicYear == '2nd Year'}">2nd Year</option>
                                        <option value="3rd Year" th:selected="${user.academicYear == '3rd Year'}">3rd Year</option>
                                        <option value="4th Year" th:selected="${user.academicYear == '4th Year'}">4th Year</option>
                                        <option value="Other" th:selected="${user.academicYear == 'Other'}">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="registerNumber"><i class="bi bi-person-vcard"></i> Register no.</label>
                                    <input id="registerNumber" class="form-control" name="registerNumber" th:value="${user.registerNumber}">
                                </div>
                            </div>
                            <button class="btn-brand" type="submit"><i class="bi bi-check-circle"></i> Save changes</button>
                        </form>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
