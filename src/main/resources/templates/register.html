<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register | IntelliExam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments :: head-assets}"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments :: navbar}"></div>
    <main class="auth-wrap">
        <div class="container">
            <div class="auth-grid">
                <section class="auth-copy animate-fade-up">
                    <span class="eyebrow"><i class="bi bi-stars"></i> Join IntelliExam</span>
                    <h1 class="display-5 fw-bold mt-3">One account for exams, reports, and assessment control.</h1>
                    <p class="mb-0">Choose Student to take exams or Examiner to create and manage assessments.</p>
                </section>
                <section class="auth-panel animate-fade-up delay-1">
                    <span class="badge-soft"><i class="bi bi-person-plus"></i> Create account</span>
                    <h2 class="h3 fw-bold mt-3">Student / Examiner Registration</h2>
                    <div class="alert alert-danger" th:if="${error}"><i class="bi bi-exclamation-octagon"></i> <span th:text="${error}"></span></div>
                    <form method="post" th:action="@{/register}" class="mt-3">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="fullName"><i class="bi bi-person"></i> Full name</label>
                                <input id="fullName" class="form-control" name="fullName" placeholder="Full name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email"><i class="bi bi-envelope"></i> Email</label>
                                <input id="email" class="form-control" name="email" type="email" placeholder="you@example.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="password"><i class="bi bi-key"></i> Password</label>
                                <input id="password" class="form-control" name="password" type="password" placeholder="Create password" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="phone"><i class="bi bi-telephone"></i> Phone</label>
                                <input id="phone" class="form-control" name="phone" pattern="[0-9]{10}" maxlength="10" minlength="10" title="please enter a 10-digit phone number" placeholder="Phone number" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="college"><i class="bi bi-building"></i> College / Organization</label>
                                <input id="college" class="form-control" name="college" placeholder="Institution name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="role"><i class="bi bi-people"></i> Role</label>
                                <select id="role" class="form-select" name="role">
                                    <option value="STUDENT">Student</option>
                                    <option value="EXAMINER">Examiner</option>
                                </select>
                            </div>
                            <div class="col-12 student-extra">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label" for="branch"><i class="bi bi-diagram-3"></i> Branch / Department</label>
                                        <input id="branch" class="form-control student-required" name="branch" placeholder="CSE, ECE, MBA...">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label" for="academicYear"><i class="bi bi-calendar2-week"></i> Year</label>
                                        <select id="academicYear" class="form-select student-required" name="academicYear">
                                            <option value="">Select year</option>
                                            <option value="1st Year">1st Year</option>
                                            <option value="2nd Year">2nd Year</option>
                                            <option value="3rd Year">3rd Year</option>
                                            <option value="4th Year">4th Year</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label" for="registerNumber"><i class="bi bi-person-vcard"></i> Register number</label>
                                        <input id="registerNumber" class="form-control student-required" name="registerNumber" placeholder="University register no.">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button class="btn-brand w-100 mt-4" type="submit"><i class="bi bi-check-circle"></i> Create account</button>
                    </form>
                    <p class="muted-copy mt-4 mb-0 text-center">Already registered? <a th:href="@{/login}">Login</a></p>
                </section>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
    const roleSelect = document.getElementById('role');
    const studentExtra = document.querySelector('.student-extra');
    const studentRequired = document.querySelectorAll('.student-required');

    function syncStudentFields() {
        const isStudent = roleSelect.value === 'STUDENT';
        studentExtra.style.display = isStudent ? '' : 'none';
        studentRequired.forEach((field) => field.required = isStudent);
    }

    roleSelect.addEventListener('change', syncStudentFields);
    syncStudentFields();
</script>
</body>
</html>
