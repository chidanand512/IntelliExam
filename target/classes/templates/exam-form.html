<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Exam | IntelliExam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments :: head-assets}"></th:block>
</head>
<body>
<div class="app-shell-app">
    <aside th:replace="~{fragments :: sidenav('EXAMINER', 'newexam')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments :: topbar('Create exam','Define the exam, schedule, and access password.')}"></header>

        <main class="app-content animate-fade-up">
            <div class="row g-4 justify-content-center">
                <div class="col-lg-9">
                    <section class="content-panel animate-pop">
                        <span class="badge-soft"><i class="bi bi-pencil-square"></i> Assessment setup</span>
                        <h1 class="h2 fw-bold mt-3">Create Exam / Assessment</h1>
                        <p class="muted-copy">Add the exam identity, schedule, total question limit, and private access password. Questions are added after saving.</p>
                        <form method="post" th:action="@{/examiner/exam/save}" th:object="${exam}" class="mt-4">
                            <label class="form-label" for="title"><i class="bi bi-card-text"></i> Exam title</label>
                            <input id="title" class="form-control mb-3" th:field="*{title}" placeholder="Example: Java fundamentals mock test" required>

                            <label class="form-label" for="description"><i class="bi bi-text-paragraph"></i> Description</label>
                            <textarea id="description" class="form-control mb-3" rows="3" th:field="*{description}" placeholder="Short instructions or syllabus summary"></textarea>

                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="form-label" for="duration"><i class="bi bi-stopwatch"></i> Duration (min)</label>
                                    <input id="duration" class="form-control" type="number" min="1" th:field="*{durationMinutes}" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label" for="totalQuestions"><i class="bi bi-question-circle"></i> Total questions</label>
                                    <input id="totalQuestions" class="form-control" type="number" min="1" max="200" th:field="*{totalQuestions}" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label" for="date"><i class="bi bi-calendar"></i> Exam date</label>
                                    <input id="date" class="form-control" type="date" th:field="*{examDate}" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label" for="time"><i class="bi bi-clock"></i> Exam time</label>
                                    <input id="time" class="form-control" type="time" th:field="*{examTime}" required>
                                </div>
                            </div>

                            <label class="form-label mt-3" for="password"><i class="bi bi-shield-lock"></i> Exam password</label>
                            <input id="password" class="form-control mb-4" th:field="*{examPassword}" placeholder="Share only with eligible students" required>

                            <label class="form-label"><i class="bi bi-broadcast"></i> Exam access</label>
                            <div class="toggle-card mb-4">
                                <label class="toggle-option">
                                    <input type="radio" th:field="*{publicExam}" value="false" checked>
                                    <span><strong>Private</strong><small>Visible to logged-in college students only.</small></span>
                                </label>
                                <label class="toggle-option">
                                    <input type="radio" th:field="*{publicExam}" value="true">
                                    <span><strong>Public</strong><small>Creates a shareable link for outside students too.</small></span>
                                </label>
                            </div>

                            <label class="form-label"><i class="bi bi-sliders"></i> Exam options</label>
                            <div class="toggle-card exam-options mb-4">
                                <label class="toggle-option">
                                    <input id="negativeMarking" type="checkbox" th:field="*{negativeMarking}">
                                    <span><strong>Negative marking</strong><small>Deduct marks for wrong answers.</small></span>
                                </label>
                                <label class="toggle-option">
                                    <input type="checkbox" th:field="*{shuffleQuestions}">
                                    <span><strong>Shuffle questions</strong><small>Show questions in different order for students.</small></span>
                                </label>
                                <label class="toggle-option">
                                    <input type="checkbox" th:field="*{strictFullscreen}">
                                    <span><strong>Strict full screen</strong><small>Start only after full screen is enabled.</small></span>
                                </label>
                                <div id="negativeMarkPanel" class="negative-mark-panel">
                                    <label class="form-label" for="negativeMarksPerWrong">Marks deducted per wrong answer</label>
                                    <input id="negativeMarksPerWrong" class="form-control" type="number" min="1" max="10" th:field="*{negativeMarksPerWrong}">
                                </div>
                            </div>

                            <div class="d-flex gap-2 flex-wrap">
                                <button class="btn-brand" type="submit"><i class="bi bi-check-circle"></i> Save exam</button>
                                <a class="btn-line" th:href="@{/examiner/dashboard}"><i class="bi bi-x-circle"></i> Cancel</a>
                            </div>
                        </form>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
    const negativeMarking = document.getElementById('negativeMarking');
    const negativeMarkPanel = document.getElementById('negativeMarkPanel');
    function syncNegativeMarking() {
        negativeMarkPanel.style.display = negativeMarking.checked ? '' : 'none';
    }
    negativeMarking.addEventListener('change', syncNegativeMarking);
    syncNegativeMarking();
</script>
</body>
</html>
