<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | IntelliExam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments :: head-assets}"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments :: navbar}"></div>
    <main class="auth-wrap">
        <div class="container">
            <div class="auth-grid">
                <section class="auth-copy animate-fade-up">
                    <span class="eyebrow"><i class="bi bi-hand-thumbs-up"></i> Welcome back</span>
                    <h1 class="display-5 fw-bold mt-3">Continue your secure exam workflow.</h1>
                    <p class="mb-0">Students can join published exams. Examiners can create tests, manage questions, publish exams, and export results.</p>
                </section>
                <section class="auth-panel animate-fade-up delay-1">
                    <span class="badge-soft"><i class="bi bi-person-lock"></i> Account access</span>
                    <h2 class="h3 fw-bold mt-3">Login</h2>
                    <p class="muted-copy">Use your registered email and password.</p>
                    <div class="alert alert-danger" th:if="${error}"><i class="bi bi-exclamation-octagon"></i> <span th:text="${error}"></span></div>
                    <div class="alert alert-success" th:if="${success}"><i class="bi bi-check-circle"></i> <span th:text="${success}"></span></div>
                    <form method="post" th:action="@{/login}" class="mt-3">
                        <label class="form-label" for="email"><i class="bi bi-envelope"></i> Email</label>
                        <input id="email" class="form-control mb-3" name="email" type="email" placeholder="you@example.com" required>
                        <label class="form-label" for="password"><i class="bi bi-key"></i> Password</label>
                        <input id="password" class="form-control mb-4" name="password" type="password" placeholder="Enter password" required>
                        <button class="btn-brand w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Login</button>
                    </form>
                    <p class="muted-copy mt-4 mb-0 text-center">New to IntelliExam? <a th:href="@{/register}">Create an account</a></p>
                </section>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
