<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ongoing Tests | IntelliExam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments :: head-assets}"></th:block>
</head>
<body>
<div class="app-shell-app">
    <aside th:replace="~{fragments :: sidenav('STUDENT', 'ongoing')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments :: topbar('Ongoing tests','Tests open for you right now.')}"></header>

        <main class="app-content animate-fade-up">
            <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
                <div>
                    <span class="badge-soft success"><i class="bi bi-play-circle"></i> Available now</span>
                    <h2 class="h3 fw-bold mt-2">Take your tests</h2>
                    <p class="muted-copy mb-0">These exams are published and ready. Click view rules to start.</p>
                </div>
                <span class="badge-soft" th:text="${#lists.size(exams)} + ' available'">0 available</span>
            </div>

            <div class="exam-card-grid">
                <article class="exam-card animate-fade-up" th:each="e, st : ${exams}" th:style="'animation-delay:' + ${st.index * 0.05} + 's'">
                    <div class="d-flex justify-content-between align-items-start gap-2">
                        <span class="badge-soft success"><i class="bi bi-circle-fill" style="font-size:.5rem"></i> Open</span>
                        <span class="badge-soft info"><i class="bi bi-shield-lock"></i> Pwd</span>
                    </div>
                    <h3 th:text="${e.title}">Exam</h3>
                    <p class="muted-copy small mb-0" th:text="${e.description}">Description</p>
                    <div class="exam-card-meta">
                        <span><i class="bi bi-calendar"></i> <span th:text="${e.examDate}">date</span></span>
                        <span><i class="bi bi-clock"></i> <span th:text="${e.examTime}">time</span></span>
                        <span><i class="bi bi-stopwatch"></i> <span th:text="${e.durationMinutes} + ' min'">duration</span></span>
                        <span><i class="bi bi-question-circle"></i> <span th:text="${e.totalQuestions} + ' Qs'">Qs</span></span>
                    </div>
                    <a class="btn-brand" th:href="@{'/student/exam/' + ${e.id} + '/rules'}"><i class="bi bi-box-arrow-in-right"></i> View rules &amp; start</a>
                </article>

                <div class="exam-card text-center" th:if="${#lists.isEmpty(exams)}">
                    <i class="bi bi-emoji-frown" style="font-size:2.4rem;color:var(--muted)"></i>
                    <h3 class="h5 mt-2">No ongoing tests</h3>
                    <p class="muted-copy mb-0">Check <a th:href="@{/student/upcoming}">upcoming tests</a> for what's next.</p>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
