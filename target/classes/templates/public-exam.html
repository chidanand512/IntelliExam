<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Public Exam | IntelliExam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments :: head-assets}"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments :: navbar}"></div>
    <main class="auth-wrap">
        <div class="container">
            <div class="auth-grid">
                <section class="auth-copy animate-fade-up">
                    <span class="eyebrow"><i class="bi bi-link-45deg"></i> Public exam access</span>
                    <h1 class="display-5 fw-bold mt-3" th:text="${exam.title}">Exam title</h1>
                    <p class="mb-3" th:text="${exam.description}">Exam description</p>
                    <div class="d-flex gap-2 flex-wrap">
                        <span class="badge-soft"><i class="bi bi-stopwatch"></i> <span th:text="${exam.durationMinutes} + ' min'">Duration</span></span>
                        <span class="badge-soft"><i class="bi bi-question-circle"></i> <span th:text="${exam.totalQuestions} + ' questions'">Questions</span></span>
                        <span class="badge-soft info"><i class="bi bi-broadcast"></i> Public</span>
                        <span class="badge-soft danger" th:if="${exam.negativeMarking}">
                            <i class="bi bi-dash-circle"></i>
                            <span th:text="'-' + ${exam.negativeMarksPerWrong} + ' per wrong'">Negative</span>
                        </span>
                    </div>
                </section>
                <section class="auth-panel animate-fade-up delay-1">
                    <span class="badge-soft"><i class="bi bi-person-lines-fill"></i> Student details</span>
                    <h2 class="h3 fw-bold mt-3">Enter details to start</h2>
                    <div class="alert alert-danger" th:if="${error}"><i class="bi bi-exclamation-octagon"></i> <span th:text="${error}"></span></div>
                    <form method="post" th:action="@{'/public/exam/' + ${exam.publicToken} + '/start'}" class="mt-3">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="fullName"><i class="bi bi-person"></i> Full name</label>
                                <input id="fullName" class="form-control" name="fullName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email"><i class="bi bi-envelope"></i> Email</label>
                                <input id="email" class="form-control" name="email" type="email" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="phone"><i class="bi bi-telephone"></i> Phone</label>
                                <input id="phone" class="form-control" name="phone" pattern="[0-9]{10}" maxlength="10" minlength="10" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="college"><i class="bi bi-building"></i> College / Organization</label>
                                <input id="college" class="form-control" name="college" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="branch"><i class="bi bi-diagram-3"></i> Branch</label>
                                <input id="branch" class="form-control" name="branch" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="academicYear"><i class="bi bi-calendar2-week"></i> Year</label>
                                <select id="academicYear" class="form-select" name="academicYear" required>
                                    <option value="">Select year</option>
                                    <option value="1st Year">1st Year</option>
                                    <option value="2nd Year">2nd Year</option>
                                    <option value="3rd Year">3rd Year</option>
                                    <option value="4th Year">4th Year</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="registerNumber"><i class="bi bi-person-vcard"></i> Register no.</label>
                                <input id="registerNumber" class="form-control" name="registerNumber" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="examPassword"><i class="bi bi-key"></i> Exam password</label>
                                <input id="examPassword" class="form-control" name="examPassword" type="password" required>
                            </div>
                        </div>
                        <button class="btn-brand w-100 mt-4" type="submit"><i class="bi bi-arrows-fullscreen"></i> Start exam</button>
                    </form>
                </section>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
